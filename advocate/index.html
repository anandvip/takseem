<!--
list of lawyers engaged in the case.
1. advocate sumit garg[prepared the file][but got greedy and delayed the process 25k[12/04/25] paid plus 12500 [6500/11/07/25]+[-6k/17/11/25]]
advocate lukhwinder singh[lucy patwari adhoc proxy for pateari in pehowa tehsil land area].
2. advocate lukhwinder[lucky].-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Case Advocates</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2933;--mute:#6b7280;--line:#e3ded2;--accent:#2f5d50;--warn:#b45309;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#14181a;--card:#1d2326;--ink:#e8ecee;--mute:#9aa5ab;--line:#2c3539;--accent:#6fb59f;--warn:#f5b042;--warnbg:#3a2e12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:.9rem}
h2{font-size:1.05rem;margin:28px 0 10px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:1.4rem}
.stat span{color:var(--mute);font-size:.8rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card h3{margin:0 0 2px;font-size:1.05rem}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mute);margin-bottom:8px}
.card p{margin:6px 0 0;font-size:.9rem}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.9rem}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;color:var(--mute);letter-spacing:.05em}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;background:var(--bg)}
td.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.flag{background:var(--warnbg);color:var(--warn);font-size:.7rem;padding:1px 7px;border-radius:99px;margin-left:6px;cursor:pointer;user-select:none}
.ednote{display:inline-block;min-width:6ch;max-width:100%;padding:1px 6px;margin:-1px -6px;border-radius:6px;border:1px solid transparent;cursor:text;outline:none;overflow-wrap:anywhere}
.ednote:hover{border-color:var(--line)}
.ednote:focus{border-color:var(--accent);background:var(--bg)}
.ednote:empty:before{content:"Add note\2026";color:var(--mute)}
.st{color:var(--accent);font-size:.8rem;align-self:center;opacity:0;transition:opacity .25s}
.st.on{opacity:1}
.scroll{overflow-x:auto}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
input,select,button{font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border-color:var(--line);padding:3px 9px;font-size:.8rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Case Advocates</h1>
  <p class="sub">Pehowa tehsil land matter &middot; draft v0.5 &middot; saved only in this browser</p>

  <div class="stats">
    <div class="stat"><b id="sAdv">0</b><span>Advocates</span></div>
    <div class="stat"><b id="sPaid">0</b><span>Total paid (&#8377;)</span></div>
    <div class="stat"><b id="sFlag">0</b><span>Entries to confirm</span></div>
  </div>

  <h2>Advocates</h2>
  <div class="cards" id="cards"></div>

  <h2>Payment ledger</h2>
  <div class="scroll"><table>
    <thead><tr><th>Date</th><th>Advocate</th><th>Note</th><th style="text-align:right">&#8377;</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
    <tfoot id="foot"></tfoot>
  </table></div>

  <form id="f">
    <input type="date" id="fd" required>
    <select id="fa" required></select>
    <input id="fn" placeholder="Note">
    <input type="number" id="fm" placeholder="Amount (use - for refund)" required>
    <button>Add entry</button>
  </form>
  <div class="row">
    <button class="ghost" id="imp">Import JSON</button>
    <input type="file" id="impf" accept=".json,application/json" hidden>
    <button class="ghost" id="exp">Export JSON</button>
    <button class="ghost" id="rst">Reset to starting data</button>
    <span class="st" id="st">Saved</span>
  </div>

</div>

<script>
const KEY="advocate-draft-v2";
const seed=()=>({
  advocates:[
    {id:"a1",name:"Advocate Sumit Garg",role:"Prepared the file",note:"Delayed the process."}
  ],
  ledger:[
    {id:"l1",date:"2025-04-12",adv:"a1",note:"Paid",amt:25000,flag:false},
    {id:"l2",date:"2025-07-11",adv:"a1",note:"Part of 12,500",amt:6500,flag:false},
    {id:"l3",date:"2025-11-17",adv:"a1",note:"Written as '-6k'. Assumed balance of 12,500 - confirm",amt:6000,flag:true}
  ]
});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>Number(n).toLocaleString("en-IN");
const fmt=d=>{const [y,m,dd]=d.split("-");return `${dd}/${m}/${y.slice(2)}`};
function render(){
  document.getElementById("sAdv").textContent=S.advocates.length;
  document.getElementById("sPaid").textContent=inr(S.ledger.reduce((a,l)=>a+l.amt,0));
  document.getElementById("sFlag").textContent=S.ledger.filter(l=>l.flag).length;
  const tot=S.ledger.reduce((a,l)=>a+l.amt,0), n=S.ledger.length;
  document.getElementById("foot").innerHTML=`<tr><td colspan="3">Total paid &middot; ${n} entr${n===1?"y":"ies"}</td><td class="amt" id="tTot">${inr(tot)}</td><td></td></tr>`;
  document.getElementById("cards").innerHTML=S.advocates.map(a=>{
    const t=S.ledger.filter(l=>l.adv===a.id).reduce((x,l)=>x+l.amt,0);
    return `<div class="card"><h3>${esc(a.name)}</h3><span class="tag">${esc(a.role)}</span><p>${esc(a.note)}</p><p><b>&#8377;${inr(t)}</b> paid so far</p></div>`}).join("");
  const nm=id=>(S.advocates.find(a=>a.id===id)||{name:"?"}).name;
  document.getElementById("rows").innerHTML=[...S.ledger].sort((a,b)=>a.date<b.date?-1:1).map(l=>
    `<tr><td>${fmt(l.date)}</td><td>${esc(nm(l.adv))}</td><td><span class="ednote" contenteditable="true" spellcheck="false" data-n="${l.id}" title="Click to edit">${esc(l.note)}</span>${l.flag?`<span class="flag" data-f="${l.id}" title="Click once confirmed">confirm</span>`:''}</td><td class="amt">${inr(l.amt)}</td><td><button class="ghost" data-d="${l.id}">&times;</button></td></tr>`).join("");
  document.getElementById("fa").innerHTML=S.advocates.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("");
}
document.getElementById("f").onsubmit=e=>{
  e.preventDefault();
  S.ledger.push({id:"l"+Date.now(),date:fd.value,adv:fa.value,note:fn.value,amt:Number(fm.value),flag:false});
  save();render();e.target.reset();
};
const rowsEl=document.getElementById("rows");
rowsEl.onclick=e=>{
  const id=e.target.dataset.d, fid=e.target.dataset.f;
  if(id&&confirm("Delete this entry?")){S.ledger=S.ledger.filter(l=>l.id!==id);save();render()}
  if(fid){const l=S.ledger.find(x=>x.id===fid);if(l){l.flag=false;save();render()}}
};
// notes: edit in place on click, save on blur
let stT;
function saved(){const st=document.getElementById("st");st.classList.add("on");clearTimeout(stT);stT=setTimeout(()=>st.classList.remove("on"),1400)}
rowsEl.addEventListener("focusout",e=>{
  const el=e.target.closest&&e.target.closest(".ednote");
  if(!el)return;
  const l=S.ledger.find(x=>x.id===el.dataset.n);
  if(!l)return;
  const v=el.innerText.replace(/\s+/g," ").trim();
  el.textContent=v;
  if(v!==l.note){l.note=v;save();saved()}
});
rowsEl.addEventListener("keydown",e=>{
  const el=e.target.closest&&e.target.closest(".ednote");
  if(!el)return;
  if(e.key==="Enter"){e.preventDefault();el.blur()}
  if(e.key==="Escape"){const l=S.ledger.find(x=>x.id===el.dataset.n);el.textContent=l?l.note:"";el.blur()}
});
rowsEl.addEventListener("paste",e=>{
  if(!(e.target.closest&&e.target.closest(".ednote")))return;
  e.preventDefault();
  document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text/plain"));
});
document.getElementById("exp").onclick=()=>{
  const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="advocates.json";a.click();
};
// ---- Import JSON: tolerant of this page's own export and of generic journal exports ----
const pick=(o,keys)=>{for(const k of keys){const f=Object.keys(o).find(x=>x.toLowerCase()===k);if(f!==undefined&&o[f]!==null&&o[f]!=="")return o[f]}};
function toISO(v){
  if(v===undefined)return null;
  if(typeof v==="number"){const d=new Date(v>1e11?v:v*1000);return isNaN(d)?null:d.toISOString().slice(0,10)}
  const t=String(v).trim();
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/);       // day first, as written in your notes
  if(m){const y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  const d=new Date(t);return isNaN(d)?null:d.toISOString().slice(0,10);
}
function toAmt(v){
  if(typeof v==="number")return v;
  if(v===undefined)return null;
  const t=String(v).toLowerCase().replace(/[₹,\s]|rs\.?|inr/g,"");
  const m=t.match(/^(-?)(\d+(?:\.\d+)?)(k)?$/);
  if(!m)return null;
  return (m[1]?-1:1)*Number(m[2])*(m[3]?1000:1);
}
function normalise(raw){
  let list=raw;
  if(!Array.isArray(list))list=raw.ledger||raw.entries||raw.payments||raw.transactions||raw.items||raw.data||[];
  const out=[],bad=[];
  list.forEach((o,i)=>{
    if(!o||typeof o!=="object"){bad.push(i+1);return}
    const date=toISO(pick(o,["date","dt","day","paidon","paid_on","when","timestamp","createdat","created_at","time"]));
    const amt=toAmt(pick(o,["amt","amount","value","paid","rupees","inr","sum"]));
    let note=String(pick(o,["note","notes","description","desc","remark","remarks","text","title","memo","entry","content"])||"").trim();
    const mode=pick(o,["mode","method","via","type"]);
    if(mode&&!note.toLowerCase().includes(String(mode).toLowerCase()))note=note?`${mode} - ${note}`:String(mode);
    if(!date||amt===null||isNaN(amt)){bad.push(i+1);return}
    out.push({id:o.id&&String(o.id)||"",date,amt,note,flag:o.flag===true});
  });
  return {out,bad};
}
document.getElementById("imp").onclick=()=>document.getElementById("impf").click();
document.getElementById("impf").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";
  if(!f)return;
  let raw;
  try{raw=JSON.parse(await f.text())}catch(err){alert("That file is not valid JSON.");return}
  const {out,bad}=normalise(raw);
  const key=l=>`${l.date}|${l.amt}|${l.note.toLowerCase()}`;
  const have=new Set(S.ledger.map(key)), ids=new Set(S.ledger.map(l=>l.id));
  const fresh=out.filter(l=>!have.has(key(l))&&!(l.id&&ids.has(l.id)));
  const dup=out.length-fresh.length;
  if(!out.length){alert("No usable entries found. Each entry needs a date and an amount."+(bad.length?`\n\nSkipped entries: ${bad.length}`:""));return}
  const sample=fresh.slice(0,5).map(l=>`${fmt(l.date)}  ${inr(l.amt)}  ${l.note.slice(0,40)}`).join("\n");
  if(!confirm(`Import ${fresh.length} new entr${fresh.length===1?"y":"ies"} for ${S.advocates[0].name}?\n\nAlready present (skipped): ${dup}\nUnreadable (skipped): ${bad.length}${bad.length?" (entry no. "+bad.slice(0,10).join(", ")+")":""}\n\nFirst few:\n${sample}`))return;
  fresh.forEach((l,i)=>S.ledger.push({id:l.id&&!ids.has(l.id)?l.id:"l"+Date.now()+"_"+i,date:l.date,adv:S.advocates[0].id,note:l.note,amt:l.amt,flag:l.flag}));
  save();render();saved();
};
document.getElementById("rst").onclick=()=>{
  if(confirm("Reset everything to the starting data?")){S=seed();save();render()}
};
render();
</script>
</body>
</html>
